# Run an image built locally or supplied through JNETWORK_IMAGE.
services:
  jnetwork:
    image: ${JNETWORK_IMAGE:-jonytran86/jnetwork:latest}
    container_name: jnetwork
    restart: unless-stopped
    ports:
      - "${JNETWORK_PORT:-3112}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "const r = await fetch('http://127.0.0.1:3000/'); process.exit(r.ok ? 0 : 1)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
