<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="logo-coral-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2D55" />
      <stop offset="60%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>
    <linearGradient id="logo-accent-pink" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDA4AF" />
      <stop offset="100%" stop-color="#FF2D55" />
    </linearGradient>
    <linearGradient id="logo-cyan-node" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Clean, Soft Rounded Background -->
  <rect x="2" y="2" width="96" height="96" rx="26" fill="#FFF1F2" stroke="#FECDD3" stroke-width="2" />

  <!-- Network Connection Lines -->
  <path d="M40 24 L70 24" stroke="url(#logo-accent-pink)" stroke-width="5.5" stroke-linecap="round" />
  <path d="M62 24 L62 58 C62 72 52 80 38 80 C28 80 22 75 18 69" stroke="url(#logo-coral-grad)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M62 46 L80 60" stroke="url(#logo-coral-grad)" stroke-width="5" stroke-linecap="round" />

  <!-- Network Nodes -->
  <circle cx="70" cy="24" r="5.5" fill="#FF2D55" />
  <circle cx="70" cy="24" r="2.5" fill="#FFFFFF" />

  <circle cx="40" cy="24" r="4.5" fill="#FB7185" />
  <circle cx="40" cy="24" r="2" fill="#FFFFFF" />

  <circle cx="62" cy="46" r="4" fill="#FF2D55" />

  <circle cx="80" cy="60" r="5.5" fill="url(#logo-cyan-node)" />
  <circle cx="80" cy="60" r="2.2" fill="#FFFFFF" />

  <circle cx="18" cy="69" r="5.5" fill="#E11D48" />
  <circle cx="18" cy="69" r="2.5" fill="#FFFFFF" />
</svg>
